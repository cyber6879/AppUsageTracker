name: Unpack Project & Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack Project Archive & Push Source Tree
        run: |
          if [ -f "project_bundle.b64" ]; then
            base64 -d project_bundle.b64 > project.zip
            unzip -o project.zip
            rm -f project_bundle.b64 project.zip
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: unpack complete AppUsageTracker Android project" || true
            git push origin HEAD:main || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Build Debug & Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p release_artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release_artifacts/AppUsageTracker-v1.0.0-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppUsageTracker-debug-apk
          path: release_artifacts/AppUsageTracker-v1.0.0-debug.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.0
          name: "AppUsageTracker v1.0.0 (Android APK)"
          body: "自动构建生成的 Android 安装包 AppUsageTracker-v1.0.0-debug.apk，直接下载即可在 Android 8.0+ 设备上安装运行。"
          files: release_artifacts/AppUsageTracker-v1.0.0-debug.apk
